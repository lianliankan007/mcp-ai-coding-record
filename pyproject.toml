[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-mcp-server"
version = "0.1.0"
description = "Minimal HTTP MCP server that stores and retrieves coding memories with Qdrant and Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["mcp", "memory", "qdrant", "ollama", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.28.0,<1.0.0",
  "mcp>=1.26.0,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "qdrant-client>=1.17.0,<2.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/lianliankan007/mcp-ai-coding-record"
Repository = "https://github.com/lianliankan007/mcp-ai-coding-record.git"
Issues = "https://github.com/lianliankan007/mcp-ai-coding-record/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[project.scripts]
memory-mcp-server = "memory_mcp_server.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
