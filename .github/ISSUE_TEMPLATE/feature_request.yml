name: Feature Request
description: Propose an improvement for Memory MCP Server
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题
      description: 描述当前限制或痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议方案
      description: 说明希望新增或调整的行为
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响与取舍
      description: 是否会影响性能、兼容性、默认链路或配置复杂度
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如有其他方案或为什么当前做法不够用，也请说明
