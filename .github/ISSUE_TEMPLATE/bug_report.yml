name: Bug Report
description: Report a reproducible defect in Memory MCP Server
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题。请尽量提供可复现信息，避免只给截图或结论。
  - type: input
    id: summary
    attributes:
      label: 问题概述
      description: 用一句话描述问题
      placeholder: memory_search 在 Qdrant 超时后直接失败
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出最小复现步骤
      placeholder: |
        1. 配置 .env
        2. 启动服务
        3. 调用 memory_search
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: Python 版本、OS、Qdrant/Ollama 版本、关键配置
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 如有日志或 traceback，请贴在这里并打码敏感信息
      render: shell
